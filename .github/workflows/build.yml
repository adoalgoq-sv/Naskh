name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Naskh*.zip
      - run: |
          sed -i 's/2024.09.00/2024.06.00/' Naskh/app/build.gradle.kts
          sed -i 's/cz.adaptive:/cz.adaptech.tesseract4android:/' Naskh/app/build.gradle.kts
          sed -i 's|mavenCentral() }|mavenCentral(); maven { url = uri("https://jitpack.io") } }|' Naskh/settings.gradle.kts
          sed -i 's/Builder(null, /Builder(android.R.drawable.ic_menu_crop, /' Naskh/app/src/main/java/com/naskh/app/CaptureService.kt
          sed -i 's|startForeground(1, notification(), android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)|if (android.os.Build.VERSION.SDK_INT >= 29) startForeground(1, notification(), android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION) else startForeground(1, notification())|' Naskh/app/src/main/java/com/naskh/app/CaptureService.kt
          echo "android.useAndroidX=true" >> Naskh/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> Naskh/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: Naskh
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || { grep -m1 -A15 "What went wrong" build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Naskh-APK
          path: Naskh/app/build/outputs/apk/debug/app-debug.apk
